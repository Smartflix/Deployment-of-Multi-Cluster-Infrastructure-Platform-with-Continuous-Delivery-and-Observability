apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudopshub-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudopshub-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "up{job=~\".*backend.*\"}",
              "legendFormat": "backend scrape up"
            }
          ],
          "title": "Backend Scrape Health",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "cloudopshub_database_reachable",
              "legendFormat": "database reachable"
            }
          ],
          "title": "RDS Reachability",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "cloudopshub"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "CloudOpsHub Application",
      "uid": "cloudopshub-app",
      "version": 1
    }
