name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
      - name: Scan image with Trivy (frontend)
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}
      - name: Scan image with Trivy (backend)
        uses: aquasecurity/trivy-action@v2
        with:
          scan-type: 'image'
          image-ref: ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}
      - name: Create image metadata
        run: |
          echo "FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/frontend:${{ github.sha }}" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/backend:${{ github.sha }}" >> $GITHUB_ENV
