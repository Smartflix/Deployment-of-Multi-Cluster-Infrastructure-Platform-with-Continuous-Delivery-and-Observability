name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, staging, fix-push ]
    paths:
      - apps/**
      - infra/terraform/**
      - k8s/**
      - monitoring/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [ main, staging ]
    paths:
      - apps/**
      - infra/terraform/**
      - k8s/**
      - monitoring/**
      - .github/workflows/ci.yml

concurrency:
  group: cloudopshub-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ci:
    name: Application CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate backend Python syntax
        run: python -m py_compile apps/backend/app.py

      - name: Smoke test backend API
        run: |
          python apps/backend/app.py &
          server_pid=$!
          trap "kill $server_pid" EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done

          python -m json.tool /tmp/healthz.json > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/summary > /tmp/summary.json
          python -m json.tool /tmp/summary.json > /dev/null

      - name: Validate frontend assets exist
        run: |
          test -s apps/frontend/index.html
          test -s apps/frontend/nginx.conf

      - name: Validate nginx config
        run: docker run --rm --add-host backend:127.0.0.1 -v "$PWD/apps/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    env:
      TF_DATA_DIR: ${{ runner.temp }}/terraform-data
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote backend
        run: terraform init -backend=false -reconfigure

      - name: Validate Terraform
        run: terraform validate

  helm-ci:
    name: Helm and Kubernetes CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint Helm charts
        run: |
          helm lint k8s/helm/backend
          helm lint k8s/helm/frontend
          helm lint k8s/helm/db

      - name: Render Helm charts
        run: |
          mkdir -p rendered
          helm template backend k8s/helm/backend --namespace cloudopshub > rendered/backend.yaml
          helm template frontend k8s/helm/frontend --namespace cloudopshub > rendered/frontend.yaml
          helm template db k8s/helm/db --namespace cloudopshub > rendered/db.yaml

      - name: Validate ArgoCD application manifests
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "k8s/apps/backend-app.yaml",
              "k8s/apps/frontend-app.yaml",
              "k8s/apps/db-app.yaml",
          ]

          for file_name in required:
              path = Path(file_name)
              if not path.exists():
                  raise SystemExit(f"Missing required manifest: {file_name}")
              text = path.read_text()
              for field in ("apiVersion:", "kind:", "metadata:", "spec:"):
                  if field not in text:
                      raise SystemExit(f"{file_name} is missing {field}")
          PY

  build-images:
    name: Build, Scan, and Push Images
    needs: [ app-ci, terraform-ci, helm-ci ]
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE_NAMESPACE: fabulousjeff2009
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: frontend
            context: apps/frontend
            image: cloudopshub-frontend
          - name: backend
            context: apps/backend
            image: cloudopshub-backend
          - name: db
            context: apps/db
            image: cloudopshub-db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  update-gitops-tags:
    name: CD - Update GitOps Image Tags
    if: github.event_name != 'pull_request'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ArgoCD image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          image_tag = os.environ["IMAGE_TAG"]
          files = [
              Path("k8s/apps/backend-app.yaml"),
              Path("k8s/apps/frontend-app.yaml"),
          ]

          for path in files:
              lines = path.read_text().splitlines()
              for index, line in enumerate(lines):
                  if line.strip() == "- name: image.tag":
                      lines[index + 1] = f"          value: {image_tag}"
                      break
              else:
                  raise SystemExit(f"image.tag parameter not found in {path}")
              path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit GitOps tag updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitOps image tags ${{ github.sha }} [skip ci]"
          file_pattern: k8s/apps/backend-app.yaml k8s/apps/frontend-app.yaml
