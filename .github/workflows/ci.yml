name: CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE_NAMESPACE: fabulousjeff2009
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app:
          - name: frontend
            context: apps/frontend
            image: cloudopshub-frontend
          - name: backend
            context: apps/backend
            image: cloudopshub-backend
          - name: db
            context: apps/db
            image: cloudopshub-db
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}
      - name: Scan image with Trivy
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}
