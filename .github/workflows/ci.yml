name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, staging, fix-push ]
    paths:
      - apps/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [ main, staging ]
    paths:
      - apps/**
      - .github/workflows/ci.yml

concurrency:
  group: cloudopshub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE_NAMESPACE: fabulousjeff2009
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: frontend
            context: apps/frontend
            image: cloudopshub-frontend
          - name: backend
            context: apps/backend
            image: cloudopshub-backend
          - name: db
            context: apps/db
            image: cloudopshub-db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.35.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.app.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  update-gitops-tags:
    if: github.event_name != 'pull_request'
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ArgoCD image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          image_tag = os.environ["IMAGE_TAG"]
          files = [
              Path("k8s/apps/backend-app.yaml"),
              Path("k8s/apps/frontend-app.yaml"),
          ]

          for path in files:
              lines = path.read_text().splitlines()
              for index, line in enumerate(lines):
                  if line.strip() == "- name: image.tag":
                      lines[index + 1] = f"          value: {image_tag}"
                      break
              else:
                  raise SystemExit(f"image.tag parameter not found in {path}")
              path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit GitOps tag updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitOps image tags ${{ github.sha }} [skip ci]"
          file_pattern: k8s/apps/backend-app.yaml k8s/apps/frontend-app.yaml
