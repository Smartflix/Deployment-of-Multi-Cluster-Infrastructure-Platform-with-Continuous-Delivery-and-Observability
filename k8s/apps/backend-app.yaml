apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/Smartflix/Deployment-of-Multi-Cluster-Infrastructure-Platform-with-Continuous-Delivery-and-Observability.git'
    targetRevision: fix-push
    path: k8s/helm/backend
    helm:
      parameters:
        - name: image.tag
          value: 2c7c38913d48c3654cc8c26b6d29637b22ff97b0
        - name: database.enabled
          value: "true"
        - name: serviceMonitor.enabled
          value: "true"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cloudopshub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
