apiVersion: v1
kind: Service
metadata:
  name: {{ include "db.fullname" . }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "db.name" . }}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: 5432
