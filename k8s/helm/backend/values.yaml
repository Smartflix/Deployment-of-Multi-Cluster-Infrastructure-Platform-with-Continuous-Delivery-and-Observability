replicaCount: 2
image:
  repository: docker.io/fabulousjeff2009/cloudopshub-backend
  tag: "rds-v2"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8080
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
database:
  enabled: false
  existingSecret: cloudopshub-rds-secret
  hostKey: DB_HOST
  portKey: DB_PORT
  nameKey: DB_NAME
  userKey: DB_USER
  passwordKey: DB_PASSWORD
