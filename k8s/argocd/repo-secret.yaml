apiVersion: v1
kind: Secret
metadata:
  name: repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  # Replace the URL below with your repository URL
  url: https://github.com/Smartflix/Deployment-of-Multi-Cluster-Infrastructure-Platform-with-Continuous-Delivery-and-Observability.git
  # For HTTPS auth with username/password or token:
  # username: smartflix            # optional for token-only
  # password: <GIT_PASSWORD_OR_TOKEN> 

  # For SSH auth, comment out the url/username/password fields and
  # add your private key below instead (keep the pipe and newlines):
  # sshPrivateKey: |
  #   -----BEGIN OPENSSH PRIVATE KEY-----
  #   ...
  #   -----END OPENSSH PRIVATE KEY-----

  # Optional: skip host key checking (not recommended for production)
  # insecureIgnoreHostKey: "true"
type: Opaque
